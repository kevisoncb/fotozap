services:
  postgres:
    image: postgres:16-alpine
    container_name: fotozap-postgres
    environment:
      POSTGRES_USER: fotozap
      POSTGRES_PASSWORD: fotozap
      POSTGRES_DB: fotozap
    ports:
      - "5432:5432"
    volumes:
      - fotozap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotozap -d fotozap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fotozap-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fotozap_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fotozap_pg:
  fotozap_redis:
