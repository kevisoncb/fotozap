# Render Blueprint for FotoZap IA
# https://render.com/docs/blueprint-spec

services:
  # API Service (Fastify)
  - type: web
    name: fotozap-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      # Database - from Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: fotozap-db
          property: connectionString
      # Redis - from Render Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: fotozap-redis
          property: connectionString

  # Admin Panel (Next.js)
  - type: web
    name: fotozap-admin
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build:admin
    startCommand: npm run start:admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: fotozap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Worker Service (BullMQ)
  - type: worker
    name: fotozap-worker
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fotozap-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fotozap-redis
          property: connectionString

databases:
  - name: fotozap-db
    databaseName: fotozap
    user: fotozap
    region: oregon
    plan: starter
    postgresMajorVersion: 16

  - name: fotozap-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
